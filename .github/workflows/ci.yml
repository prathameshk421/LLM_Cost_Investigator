name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[web]" pytest
      - name: Unit, replay and API tests
        run: python -m pytest -q
      - name: Scenario CLI (deterministic)
        run: python -m llm_cost_investigator.cli --scenario all --force-fallback
      - name: Accuracy gate (fresh seeds, 15% noise)
        run: |
          python -m llm_cost_investigator.benchmark --seeds 30 --noise 0.15 \
            --out benchmark.json --min-accuracy 0.97  # in-sample smoke check only
      - name: Held-out gate (blind generator, seeds never used for tuning)
        env:
          PYTHONPATH: .
        run: |
          python -m benchmarks.heldout.run --seed-from 60 --seed-to 64 \
            --min-hit 0.95 --max-false-alarm 0.05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: benchmark.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
