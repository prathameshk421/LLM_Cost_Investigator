# docker compose up            -> app on http://localhost:8000
# docker compose --profile kafka up   -> also Redpanda (Kafka API) + bridge
services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      LLMCI_TICK_S: "30"
    volumes:
      - llmci-data:/app/data

  redpanda:
    profiles: ["kafka"]
    image: redpandadata/redpanda:v24.2.7
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M
      --node-id 0 --check=false
      --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports: ["9092:9092"]

  kafka-bridge:
    profiles: ["kafka"]
    build: .
    depends_on: [app, redpanda]
    environment:
      LLMCI_API_TOKEN: ${LLMCI_API_TOKEN:-}
    command: >
      sh -c "pip install --no-cache-dir 'confluent-kafka>=2.4,<3.0' &&
             python scripts/kafka_bridge.py --brokers redpanda:9092 --topic llm-calls
             --api http://app:8000"
    volumes:
      - ./scripts:/app/scripts:ro

volumes:
  llmci-data:
